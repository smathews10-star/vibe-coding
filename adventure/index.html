<!DOCTYPE html>
<!--
  The Magic Stones: a choose-your-own-adventure visual novel
  v1.0 - initial build: 7-scene story, visual-novel layout (portrait over background,
         nameplate, dialogue box), typewriter text, keyboard and screen-reader support,
         Play again on every ending. Runs entirely in the browser; nothing is sent anywhere.
  v1.1 - Baddie's portrait redrawn to look bumbling rather than scary
  v1.2 - Baddie redrawn as an original space warlord instead of a devil
  v1.3 - Baddie redrawn as a sillier, human-looking villain
  v1.4 - endings play a sound made in code (victory fanfare / sad trombone), with a Sound on/off button
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Magic Stones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
<style>
  /* v1.0 - colour tokens, comic-book look: ink outlines, halftone dots, caption-paper dialogue box */
  :root {
    --ink: #231942;
    --paper: #FFF6D6;
    --paper-text: #231942;
    --gold: #FFC93C;
    --teal: #1B9AAA;
    --crimson: #D7263D;
    --choice-bg: #FFFFFF;
    --display: "Bangers", "Impact", "Arial Black", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #2E2552; --paper-text: #FFF6D6; --choice-bg: #F4EFFF; }
  }
  :root[data-theme="dark"] { --paper: #2E2552; --paper-text: #FFF6D6; --choice-bg: #F4EFFF; }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--ink); color: var(--paper-text); font-family: var(--body);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* The stage fills the screen; the background sits behind everything */
  .stage { position: relative; height: 100%; width: 100%; overflow: hidden; isolation: isolate; }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg svg { width: 100%; height: 100%; display: block; animation: fade-in .6s ease-out; }
  /* Halftone dots over the whole scene, like printed comics */
  .stage::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background-image: radial-gradient(rgba(35, 25, 66, .2) 1.2px, transparent 1.6px);
    background-size: 7px 7px;
  }

  /* Title screen */
  .title-screen {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem; padding: 1.5rem; text-align: center;
  }
  .game-title {
    margin: 0; font-family: var(--display); font-weight: 400; line-height: .95;
    font-size: clamp(3.2rem, 13vw, 7.5rem); letter-spacing: .02em;
    color: var(--gold); -webkit-text-stroke: 3px var(--ink);
    text-shadow: 6px 6px 0 var(--ink); transform: rotate(-3deg);
  }
  .tagline {
    margin: 0; max-width: 34ch; font-size: clamp(1.05rem, 2.6vw, 1.3rem); line-height: 1.5;
    background: var(--paper); color: var(--paper-text);
    border: 4px solid var(--ink); border-radius: 12px; box-shadow: 5px 5px 0 var(--ink);
    padding: .75rem 1.1rem;
  }
  .hint { margin: 0; max-width: 40ch; color: #fff; font-size: .95rem; line-height: 1.45;
          text-shadow: 0 1px 2px var(--ink), 0 0 8px var(--ink); }

  /* Game layout: scene title at top, characters in the middle, dialogue box at bottom */
  .layout {
    position: relative; z-index: 2; height: 100%;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    padding: 12px clamp(8px, 3vw, 32px) clamp(10px, 2.5vh, 24px);
  }
  /* v1.4 - top bar holds the scene title and the sound button */
  .top-bar { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
  .btn.small {
    font-size: clamp(.95rem, 2.4vw, 1.1rem); min-height: 44px;
    padding: .3rem .8rem; box-shadow: 3px 3px 0 var(--ink);
  }
  .scene-chip {
    justify-self: start; margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(1rem, 2.6vw, 1.25rem); letter-spacing: .04em;
    background: var(--ink); color: var(--gold); padding: .2rem .7rem; border-radius: 4px;
  }
  .cast {
    display: flex; justify-content: center; align-items: flex-end;
    min-height: 0; margin-bottom: -30px; padding-top: 8px;
  }
  .portrait {
    height: 100%; max-height: 540px; aspect-ratio: 2 / 3; min-width: 0; flex: 0 1 auto;
    margin-inline: -1.5%; transform-origin: bottom center;
    transition: filter .25s ease, transform .25s ease;
    animation: rise-in .35s ease-out;
  }
  .portrait svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .portrait.dim { filter: brightness(.6) saturate(.7); transform: scale(.95); }

  /* The dialogue box, with a tilted nameplate stuck to its top edge */
  .dialogue {
    position: relative; z-index: 3; width: min(100%, 920px); margin: 0 auto;
    background: var(--paper); color: var(--paper-text);
    border: 4px solid var(--ink); border-radius: 14px; box-shadow: 6px 6px 0 var(--ink);
    padding: 2.1rem clamp(1rem, 3vw, 1.75rem) 1rem;
  }
  .dialogue:focus { outline: none; }
  .nameplate {
    position: absolute; top: 0; left: clamp(12px, 3vw, 28px); margin: 0;
    transform: translateY(-55%) rotate(-2deg);
    font-family: var(--display); font-weight: 400; letter-spacing: .03em;
    font-size: clamp(1.35rem, 3.6vw, 1.85rem);
    background: var(--gold); color: var(--ink);
    border: 4px solid var(--ink); border-radius: 6px; padding: .05rem .8rem;
  }
  .nameplate[data-who="narrator"] { background: var(--teal); color: #fff; }
  .nameplate[data-who="baddie"] { background: var(--crimson); color: #fff; }
  .stamp {
    position: absolute; top: 0; right: clamp(12px, 3vw, 28px); margin: 0;
    transform: translateY(-50%) rotate(4deg);
    font-family: var(--display); font-size: clamp(1.1rem, 3vw, 1.5rem); letter-spacing: .05em;
    background: var(--ink); color: var(--gold); padding: .1rem .7rem; border-radius: 4px;
  }
  .line {
    margin: 0 0 1rem; max-width: 68ch; min-height: 3.2em; cursor: pointer;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem); line-height: 1.55;
  }
  .actions { display: flex; flex-wrap: wrap; gap: .7rem; justify-content: flex-end; }

  /* Buttons: chunky comic panels that press down when clicked */
  .btn {
    display: inline-flex; align-items: center; gap: .55rem; min-height: 46px;
    font-family: var(--display); font-size: clamp(1.15rem, 3vw, 1.4rem); letter-spacing: .04em;
    color: var(--ink); background: var(--gold); text-align: left;
    border: 3px solid var(--ink); border-radius: 8px; box-shadow: 4px 4px 0 var(--ink);
    padding: .45rem 1.1rem; cursor: pointer;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:focus-visible { outline: 4px solid var(--teal); outline-offset: 3px; }
  .btn.choice { background: var(--choice-bg); flex: 1 1 220px; }
  .key {
    display: inline-grid; place-items: center; flex: none; width: 1.7em; height: 1.7em;
    font-family: var(--body); font-weight: 700; font-size: .8rem;
    background: var(--gold); border: 2px solid var(--ink); border-radius: 4px;
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise-in { from { opacity: 0; translate: 0 16px; } to { opacity: 1; translate: 0 0; } }

  /* Phones held upright: give the characters a little less room so the text fits */
  @media (max-width: 560px) {
    .cast { margin-bottom: -18px; }
    .btn.choice { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <!-- Background art is swapped in here by the script -->
  <div class="bg" id="bg" aria-hidden="true"></div>

  <!-- Title screen, shown before the story starts -->
  <section class="title-screen" id="title-screen" aria-labelledby="game-title">
    <h1 class="game-title" id="game-title">The Magic Stones</h1>
    <p class="tagline">Baddie has come to Earth hunting for Magic Stones. You decide what happens next.</p>
    <button class="btn" id="start-btn" type="button">Start the story</button>
    <p class="hint">Click or press Enter to continue. Pick a choice with the mouse, Tab and Enter, or the 1 and 2 keys.</p>
  </section>

  <!-- The game screen -->
  <div class="layout" id="game" hidden>
    <div class="top-bar">
      <h2 class="scene-chip" id="scene-chip"></h2>
      <!-- v1.4 - turns the ending sounds on or off -->
      <button class="btn small" id="sound-btn" type="button">Sound: on</button>
    </div>
    <div class="cast" id="cast" role="group" aria-label="Characters on screen"></div>
    <section class="dialogue" id="dialogue" aria-labelledby="nameplate" tabindex="-1">
      <h3 class="nameplate" id="nameplate"></h3>
      <p class="stamp" id="stamp" hidden>The end</p>
      <!-- Visible typewriter text (hidden from screen readers so they don't hear it letter by letter) -->
      <p class="line" id="line" aria-hidden="true"></p>
      <!-- The full line for screen readers -->
      <p class="sr-only" id="sr-line"></p>
      <div class="actions" id="actions" role="group" aria-label="What happens next"></div>
    </section>
  </div>
</main>

<script>
// v1.0 - initial build

/* =====================================================================
   THE STORY
   ---------------------------------------------------------------------
   Everything the player reads lives in this one list. Edit freely.

   Each scene has:
     id          a unique name other scenes use to jump here
     title       shown in the corner of the screen
     background  which backdrop to show: "city", "mind", "canyon", "parade" or "doom"
     lines       what is said, in order. Each line has:
                   speaker   the name shown above the words ("Narrator" or a character's name)
                   portraits who stands on screen: "baddie", "captain", "ferrous", "bulk", "bore"
                   text      the words
     choices     the buttons shown after the last line: { label, next }
                 "next" must match another scene's id
     ending      add ending: true to finish the story with a Play again button
     sound       (endings only, optional) "victory" or "defeat" plays that sound

   The first scene in the list is where the story starts (and restarts).
   ===================================================================== */
const STORY = [
  {
    id: "scene1",
    title: "Scene 1: Introduction",
    background: "city",

      { speaker: "Narrator", portraits: ["baddie"],

        text: "Only the Brain Stone and the Brawn Stone are on Earth. We'll break up into two teams." },
      { speaker: "Ferrous Man", portraits: ["captain", "ferrous"],

      { speaker: "The Bulk", portraits: ["bulk", "bore"],
        text: "Bore and I will stop Baddie from finding the Brawn Stone. If he finds it, he can defeat one Superhero." },
      { speaker: "Narrator", portraits: ["baddie"],
        text: "Which Stone does Baddie find?" }
    ],
    choices: [
      { label: "The Brain Stone", next: "scene2" },
      { label: "The Brawn Stone", next: "scene3" }
    ]
  },
  {
    id: "scene2",
    title: "Scene 2: Brain Stone",
    background: "mind",
    lines: [
      { speaker: "Baddie", portraits: ["baddie"],
        text: "Ha! I have found the Brain Stone. Now I can try to control the mind of one Superhero!" },
      { speaker: "Narrator", portraits: ["captain", "ferrous"],
        text: "Choose a Superhero for an epic mental battle." }
    ],
    choices: [
      { label: "Captain Finger Lake", next: "scene4-captain" },
      { label: "Ferrous Man", next: "scene4-ferrous" }
    ]
  },
  {
    id: "scene3",
    title: "Scene 3: Brawn Stone",
    background: "canyon",
    lines: [
      { speaker: "Baddie", portraits: ["baddie"],
        text: "Ha! I have found the Brawn Stone. Now I can try to defeat one Superhero!" },
      { speaker: "Narrator", portraits: ["bulk", "bore"],
        text: "Choose a Superhero for an epic physical battle." }
    ],
    choices: [
      { label: "The Bulk", next: "scene5-bulk" },
      { label: "Bore", next: "scene5-bore" }
    ]
  },
  {
    id: "scene4-captain",
    title: "Scene 4: Battle of Brains",
    background: "mind",
    lines: [
      { speaker: "Narrator", portraits: ["baddie", "captain"],
        text: "Baddie turns the Brain Stone on Captain Finger Lake." },
      { speaker: "Captain Finger Lake", portraits: ["baddie", "captain"],
        text: "Nice try, Baddie. My mind is far too strong for you!" },
      { speaker: "Narrator", portraits: ["baddie", "captain"],
        text: "Captain Finger Lake has a very strong mind. Baddie loses!" }
    ],
    choices: [
      { label: "Continue", next: "scene6" }
    ]
  },
  {
    id: "scene4-ferrous",
    title: "Scene 4: Battle of Brains",
    background: "mind",
    lines: [
      { speaker: "Narrator", portraits: ["baddie", "ferrous"],
        text: "Baddie turns the Brain Stone on Ferrous Man." },
      { speaker: "Ferrous Man", portraits: ["baddie", "ferrous"],
        text: "Must... resist... Actually, Baddie, you make some very good points." },
      { speaker: "Narrator", portraits: ["baddie", "ferrous"],
        text: "Ferrous Man can be easily swayed. Baddie wins!" }
    ],
    choices: [
      { label: "Continue", next: "scene7" }
    ]
  },
  {
    id: "scene5-bulk",
    title: "Scene 5: Battle of Brawn",
    background: "canyon",
    lines: [
      { speaker: "Narrator", portraits: ["baddie", "bulk"],
        text: "Baddie uses the Brawn Stone to take on the Bulk." },
      { speaker: "The Bulk", portraits: ["baddie", "bulk"],
        text: "You picked the wrong Superhero to wrestle, Baddie!" },
      { speaker: "Narrator", portraits: ["baddie", "bulk"],
        text: "The Bulk is very strong physically. Baddie loses!" }
    ],
    choices: [
      { label: "Continue", next: "scene6" }
    ]
  },
  {
    id: "scene5-bore",
    title: "Scene 5: Battle of Brawn",
    background: "canyon",
    lines: [
      { speaker: "Narrator", portraits: ["baddie", "bore"],
        text: "Baddie uses the Brawn Stone to take on Bore." },
      { speaker: "Bore", portraits: ["baddie", "bore"],
        text: "Is it time for my nap already? ...Oof!" },
      { speaker: "Narrator", portraits: ["baddie", "bore"],
        text: "Bore can be more easily defeated physically. Baddie wins!" }
    ],
    choices: [
      { label: "Continue", next: "scene7" }
    ]
  },
  {
    id: "scene6",
    title: "Scene 6: Earth is saved",
    background: "parade",
    ending: true,
    sound: "victory",
    lines: [
      { speaker: "Narrator", portraits: ["captain", "ferrous", "bulk", "bore"],
        text: "Yay! There is a wonderful victory parade, and the Superheroes are awarded medals of honor." }
    ]
  },
  {
    id: "scene7",
    title: "Scene 7: Earth is doomed",
    background: "doom",
    ending: true,
    sound: "defeat",
    lines: [
      { speaker: "Narrator", portraits: ["baddie"],
        text: "Oh no! There is dreadful destruction, and the Superheroes are thrown into a chasm." }
    ]
  }
];

   ===================================================================== */

// Scatters confetti in the same spots every time (a tiny repeatable random generator)
function makeConfetti(count) {
  let seed = 7;
  const random = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const colours = ["#FFC93C", "#D7263D", "#1B9AAA", "#FFFFFF", "#7B5CD6"];
  let shapes = "";
  for (let i = 0; i < count; i++) {
    const x = Math.round(random() * 1600);
    const y = Math.round(random() * 560);
    const angle = Math.round(random() * 360);
    shapes += `<rect x="${x}" y="${y}" width="14" height="26" fill="${colours[i % colours.length]}" transform="rotate(${angle} ${x + 7} ${y + 13})"/>`;
  }
  return shapes;
}

// Draws a string of triangle flags hanging across the top of the parade
function makeBunting() {
  const colours = ["#D7263D", "#FFC93C", "#1B9AAA", "#FFFFFF"];
  let flags = "";
  for (let x = 40, i = 0; x < 1600; x += 90, i++) {
    const t = x / 1600;
    const y = 140 + 200 * t * (1 - t); // follows the sagging string
    flags += `<polygon points="${x - 32},${y} ${x + 32},${y} ${x},${y + 62}" fill="${colours[i % colours.length]}"/>`;
  }
  return `<path d="M0 140 Q800 240 1600 140" fill="none"/>` + flags;
}

/* =====================================================================
   SOUNDS (v1.4)
   ---------------------------------------------------------------------
   Both ending sounds are built from scratch with the browser's Web Audio
   API, so there are no audio files. Each sound is a list of notes: a
   pitch (in hertz), when it starts, how long it lasts, and its tone.
   ===================================================================== */

// Note pitches used below, in hertz
const NOTE = {
  B3: 246.94, C4: 261.63, Cs4: 277.18, D4: 293.66, E4: 329.63,
  G4: 392.00, C5: 523.25, E5: 659.25, G5: 783.99, C6: 1046.50
};

// The audio engine is created the first time a sound plays (browsers only
// allow sound after the player has clicked or pressed something, which
// they always have by the time an ending appears)
let audioCtx = null;
let currentBus = null;          // volume control for the sound playing now
let soundOn = true;

// Remember the player's sound setting between visits, if the browser allows it
try {
  soundOn = localStorage.getItem("magicStonesSound") !== "off";
} catch (error) {
  soundOn = true;
}

/* Get the audio engine ready, waking it up if the browser paused it.
   Returns null if this browser can't play generated sound. */
function getAudio() {
  if (!audioCtx) {
    const AudioEngine = window.AudioContext || window.webkitAudioContext;
    if (!AudioEngine) return null;
    audioCtx = new AudioEngine();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

/* Play one note. Options:
     freq     pitch in hertz
     start    seconds from now
     length   how long it lasts in seconds
     wave     the tone: "triangle" (soft), "square" (brassy), "sawtooth" (buzzy)
     volume   how loud (0 to 1, keep it small)
     slideTo  optional pitch to bend down or up to by the end of the note
     wobble   optional vibrato depth in hertz, for a wavering, crying sound
     muffle   optional cut-off in hertz to soften harsh tones */
function playNote(ctx, bus, { freq, start, length, wave = "triangle", volume = 0.15,
                              slideTo = null, wobble = 0, muffle = null }) {
  const t0 = ctx.currentTime + start;
  const oscillator = ctx.createOscillator();
  const envelope = ctx.createGain();

  oscillator.type = wave;
  oscillator.frequency.setValueAtTime(freq, t0);
  if (slideTo) oscillator.frequency.linearRampToValueAtTime(slideTo, t0 + length);

  // Shape the volume: quick fade in, hold, then fade out so notes don't click
  envelope.gain.setValueAtTime(0.0001, t0);
  envelope.gain.exponentialRampToValueAtTime(volume, t0 + 0.03);
  envelope.gain.setValueAtTime(volume, t0 + length * 0.75);
  envelope.gain.exponentialRampToValueAtTime(0.0001, t0 + length);

  // Optional vibrato: a slow wobble added to the pitch
  let lfo = null;
  if (wobble) {
    lfo = ctx.createOscillator();
    const lfoDepth = ctx.createGain();
    lfo.frequency.value = 5.5;
    lfoDepth.gain.value = wobble;
    lfo.connect(lfoDepth);
    lfoDepth.connect(oscillator.frequency);
    lfo.start(t0);
    lfo.stop(t0 + length + 0.05);
  }

  // Optional muffling filter, then out through the volume envelope
  let output = oscillator;
  if (muffle) {
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = muffle;
    oscillator.connect(filter);
    output = filter;
  }
  output.connect(envelope);
  envelope.connect(bus);

  oscillator.start(t0);
  oscillator.stop(t0 + length + 0.05);
}

/* The two ending sounds, written as lists of notes */
const SOUNDS = {
  // Triumphant fanfare: a rising "da-da-da DAAA" that lands on a big major chord
  victory: (() => {
    const brass = { wave: "square", volume: 0.07, muffle: 2400 };
    const body = { wave: "triangle", volume: 0.12 };
    const notes = [];
    [
      [NOTE.G4, 0.00, 0.14], [NOTE.C5, 0.15, 0.14], [NOTE.E5, 0.30, 0.14],
      [NOTE.G5, 0.45, 0.32], [NOTE.E5, 0.80, 0.14], [NOTE.G5, 0.95, 1.40]
    ].forEach(([freq, start, length]) => {
      notes.push({ freq, start, length, ...brass });
      notes.push({ freq, start, length, ...body });
    });
    // The final chord underneath the last note
    [NOTE.C4, NOTE.E4, NOTE.C5].forEach(freq =>
      notes.push({ freq, start: 0.95, length: 1.4, wave: "triangle", volume: 0.09 }));
    notes.push({ freq: NOTE.C6, start: 0.95, length: 1.4, wave: "sine", volume: 0.05 });
    return notes;
  })(),

  // Mournful "wah, wah, wah, waaah": four sagging notes, the last one wavering
  defeat: [
    { freq: NOTE.D4,  start: 0.00, length: 0.50, slideTo: NOTE.D4 * 0.97 },
    { freq: NOTE.Cs4, start: 0.55, length: 0.50, slideTo: NOTE.Cs4 * 0.97 },
    { freq: NOTE.C4,  start: 1.10, length: 0.50, slideTo: NOTE.C4 * 0.97 },
    { freq: NOTE.B3,  start: 1.65, length: 1.80, slideTo: NOTE.B3 * 0.93, wobble: 7 }
  ].map(note => ({ ...note, wave: "sawtooth", volume: 0.14, muffle: 900 }))
};

/* Fade out whatever sound is playing (used when restarting or muting) */
function stopSound() {
  if (!currentBus || !audioCtx) return;
  const bus = currentBus;
  currentBus = null;
  bus.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
  setTimeout(() => bus.disconnect(), 400);
}

/* Play a named sound from the SOUNDS list, if sound is switched on */
function playSound(name) {
  if (!soundOn || !SOUNDS[name]) return;
  const ctx = getAudio();
  if (!ctx) return;
  stopSound();
  currentBus = ctx.createGain();
  currentBus.gain.value = 0.9;
  currentBus.connect(ctx.destination);
  SOUNDS[name].forEach(note => playNote(ctx, currentBus, note));
}

/* Keep the sound button's words in step with the setting */
function updateSoundButton() {
  els.soundBtn.textContent = soundOn ? "Sound: on" : "Sound: off";
}

/* Switch sound on or off, and remember the choice */
function toggleSound() {
  soundOn = !soundOn;
  if (!soundOn) stopSound();
  try {
    localStorage.setItem("magicStonesSound", soundOn ? "on" : "off");
  } catch (error) {
    // Storage unavailable: the setting just lasts for this visit
  }
  updateSoundButton();
}


/* =====================================================================
   GAME ENGINE
   ---------------------------------------------------------------------
   Nothing below needs changing to edit the story.
   ===================================================================== */

// Look up scenes by id, and remember where the story begins
const scenesById = new Map(STORY.map(scene => [scene.id, scene]));
const FIRST_SCENE_ID = STORY[0].id;

// Handy references to the parts of the page we update
const els = {
  bg: document.getElementById("bg"),
  titleScreen: document.getElementById("title-screen"),
  startBtn: document.getElementById("start-btn"),
  game: document.getElementById("game"),
  chip: document.getElementById("scene-chip"),
  cast: document.getElementById("cast"),
  dialogue: document.getElementById("dialogue"),
  nameplate: document.getElementById("nameplate"),
  stamp: document.getElementById("stamp"),
  line: document.getElementById("line"),
  srLine: document.getElementById("sr-line"),
  actions: document.getElementById("actions"),
  soundBtn: document.getElementById("sound-btn")
};

// Respect the "reduce motion" setting: no typewriter effect if it's on
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

// Where the player is right now: which scene, and which line of it
const state = { scene: null, lineIndex: 0 };

// Typewriter bookkeeping: the running timer and the full line being typed
let typingTimer = null;
let typingFullText = "";

/* Check the story for mistakes (like a choice pointing to a scene that
   doesn't exist) and report them in the browser console, so edits that
   break a link are easy to spot. */
function checkStory() {
  STORY.forEach(scene => {
    if (!scene.lines || scene.lines.length === 0) {
      console.warn(`Scene "${scene.id}" has no lines.`);
    }
    if (!scene.ending && (!scene.choices || scene.choices.length === 0)) {
      console.warn(`Scene "${scene.id}" has no choices and isn't marked as an ending, so the player would get stuck.`);
    }
    (scene.choices || []).forEach(choice => {
      if (!scenesById.has(choice.next)) {
        console.warn(`Scene "${scene.id}": the choice "${choice.label}" goes to "${choice.next}", which doesn't exist.`);
      }
    });
    if (scene.background && !BACKGROUNDS[scene.background]) {
      console.warn(`Scene "${scene.id}" uses an unknown background "${scene.background}".`);
    }
    scene.lines.forEach(line => (line.portraits || []).forEach(key => {
      if (!CHARACTERS[key]) console.warn(`Scene "${scene.id}" uses an unknown portrait "${key}".`);
    }));
  });
}

/* Swap the background, but only if it's actually different from the one
   on screen (so it doesn't flicker between lines of the same scene). */
function setBackground(key) {
  const chosen = BACKGROUNDS[key] ? key : "city";
  if (els.bg.dataset.key === chosen) return;
  els.bg.dataset.key = chosen;
  els.bg.innerHTML = BACKGROUNDS[chosen];
}

/* Find which character is speaking from their display name.
   Returns their key (like "captain"), or null for the Narrator. */
function characterKeyFor(speakerName) {
  const match = Object.entries(CHARACTERS).find(([, c]) => c.name === speakerName);
  return match ? match[0] : null;
}

/* Put the characters on stage. Whoever is speaking stays bright;
   everyone else is dimmed slightly, like a visual novel spotlight. */
function renderCast(portraitKeys, speakerKey) {
  els.cast.innerHTML = "";
  portraitKeys.forEach(key => {
    const character = CHARACTERS[key];
    if (!character) return;
    const figure = document.createElement("div");
    figure.className = "portrait";
    if (speakerKey && key !== speakerKey) figure.classList.add("dim");
    figure.setAttribute("role", "img");
    figure.setAttribute("aria-label", character.name);
    figure.innerHTML = character.art;
    els.cast.appendChild(figure);
  });
}

/* Typewriter effect: reveal the line one letter at a time.
   With reduced motion turned on, the whole line appears at once. */
function typeText(fullText) {
  stopTyping();
  typingFullText = fullText;
  if (reduceMotion.matches) {
    els.line.textContent = fullText;
    return;
  }
  let shown = 0;
  els.line.textContent = "";
  typingTimer = setInterval(() => {
    shown += 1;
    els.line.textContent = fullText.slice(0, shown);
    if (shown >= fullText.length) stopTyping();
  }, 24);
}

function stopTyping() {
  clearInterval(typingTimer);
  typingTimer = null;
}

function isTyping() {
  return typingTimer !== null;
}

/* Skip the typewriter and show the whole line straight away */
function finishTyping() {
  if (!isTyping()) return;
  stopTyping();
  els.line.textContent = typingFullText;
}

/* Build one button. Choices get a small number badge showing their
   keyboard shortcut (1, 2, ...). */
function makeButton(label, onClick, { isChoice = false, number = null } = {}) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = isChoice ? "btn choice" : "btn";
  if (number !== null) {
    const key = document.createElement("span");
    key.className = "key";
    key.setAttribute("aria-hidden", "true");
    key.textContent = number;
    button.appendChild(key);
  }
  button.appendChild(document.createTextNode(label));
  button.addEventListener("click", onClick);
  return button;
}

/* Decide which buttons to show under the words:
   - more lines to come  -> "Next"
   - last line, ending   -> "Play again"
   - last line, choices  -> one button per choice
   Focus then moves to the first button, which is linked to the full line
   of text so screen readers read the words along with the button. */
function renderActions(scene, isLastLine) {
  els.actions.innerHTML = "";
  const buttons = [];

  if (!isLastLine) {
    buttons.push(makeButton("Next", () => {
      // First press finishes the typewriter; the next press moves on
      if (isTyping()) finishTyping();
      else advanceLine();
    }));
  } else if (scene.ending) {
    buttons.push(makeButton("Play again", () => goToScene(FIRST_SCENE_ID)));
  } else {
    (scene.choices || []).forEach((choice, index) => {
      buttons.push(makeButton(choice.label, () => goToScene(choice.next),
        { isChoice: true, number: index + 1 }));
    });
  }

  els.actions.setAttribute("aria-label", isLastLine && !scene.ending ? "Choices" : "Continue");
  if (buttons.length === 0) return;
  buttons[0].setAttribute("aria-describedby", "sr-line");
  els.actions.append(...buttons);
  buttons[0].focus({ preventScroll: true });
}

/* Show the current line: speaker name, characters, words and buttons */
function showLine() {
  const scene = state.scene;
  const line = scene.lines[state.lineIndex];
  const isLastLine = state.lineIndex === scene.lines.length - 1;
  const speakerKey = characterKeyFor(line.speaker);

  els.nameplate.textContent = line.speaker;
  els.nameplate.dataset.who = speakerKey || "narrator";
  els.stamp.hidden = !(scene.ending && isLastLine);

  renderCast(line.portraits || [], speakerKey);

  // Screen readers get the scene title on the first line, then speaker and words
  const sceneIntro = state.lineIndex === 0 ? `${scene.title}. ` : "";
  els.srLine.textContent = `${sceneIntro}${line.speaker}: ${line.text}`;

  typeText(line.text);
  renderActions(scene, isLastLine);

  // v1.4 - on reaching an ending, play its sound
  if (scene.ending && isLastLine) playSound(scene.sound);
}

/* Move on to the next line within the same scene */
function advanceLine() {
  if (state.lineIndex < state.scene.lines.length - 1) {
    state.lineIndex += 1;
    showLine();
  }
}

/* Jump to a scene by its id and show its first line */
function goToScene(sceneId) {
  const scene = scenesById.get(sceneId);
  if (!scene) {
    console.error(`No scene called "${sceneId}". Check the "next" values in the STORY list.`);
    return;
  }
  stopSound(); // cut off an ending sound if the player restarts quickly
  state.scene = scene;
  state.lineIndex = 0;
  setBackground(scene.background);
  els.chip.textContent = scene.title;
  document.title = `${scene.title} | The Magic Stones`;
  showLine();
}

/* Leave the title screen and begin the story */
function startGame() {
  els.titleScreen.hidden = true;
  els.game.hidden = false;
  goToScene(FIRST_SCENE_ID);
}

/* ---------- Wiring up clicks and keys ---------- */

els.startBtn.addEventListener("click", startGame);
els.soundBtn.addEventListener("click", toggleSound);

// Clicking the words finishes the typewriter early
els.line.addEventListener("click", finishTyping);

// Number keys pick choices (1 for the first, 2 for the second, and so on)
document.addEventListener("keydown", event => {
  if (els.game.hidden || event.altKey || event.ctrlKey || event.metaKey) return;
  const number = parseInt(event.key, 10);
  if (Number.isNaN(number)) return;
  const choiceButtons = els.actions.querySelectorAll(".choice");
  const target = choiceButtons[number - 1];
  if (target) {
    event.preventDefault();
    target.click();
  }
});

/* ---------- Start up ---------- */
checkStory();
setBackground("city");
updateSoundButton();
</script>
</body>
</html>
