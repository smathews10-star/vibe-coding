<!-- v3.0 - added a code-generated beep when a phase ends, plus a mute
     toggle. No audio files are used - the beep is synthesized at runtime
     with the Web Audio API. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work / Break Timer</title>
<style>
  /* Reset default spacing so the layout is predictable across browsers */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Full-height, centered layout that adapts to light/dark system preference */
  html, body {
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f4f5;
    color: #1a1a1a;
    padding: 1.5rem;
    /* Smoothly fade the background color when the phase switches, rather
       than an abrupt jump, so the change reads as a transition rather
       than a flicker. */
    transition: background-color 0.6s ease;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background: #18181b;
      color: #f4f4f5;
    }
  }

  /* Work phase: cool blue tint. Break phase: warm green tint. These are
     applied as classes on <body> from JavaScript so the whole page,
     not just the timer card, signals which phase is active. */
  body.phase-work {
    background: #eaf1fb;
  }

  body.phase-break {
    background: #eafbf1;
  }

  @media (prefers-color-scheme: dark) {
    body.phase-work {
      background: #0f2033;
    }
    body.phase-break {
      background: #0f3322;
    }
  }

  /* The label that announces which phase ("Work" / "Break") is running */
  .phase-label {
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
  }

  .phase-label.phase-work {
    color: #2563eb;
  }

  .phase-label.phase-break {
    color: #16a34a;
  }

  @media (prefers-color-scheme: dark) {
    .phase-label.phase-work {
      color: #7fb1ff;
    }
    .phase-label.phase-break {
      color: #6fe0a3;
    }
  }

  .timer-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    width: 100%;
    max-width: 600px;
  }

  /* The big countdown display - sized with vw units so it scales with
     the viewport but is capped so it never gets absurdly huge on large
     screens or too small on tiny ones */
  .display {
    font-variant-numeric: tabular-nums; /* keeps digit widths consistent so the display doesn't jitter */
    font-size: clamp(4rem, 22vw, 12rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.02em;
    text-align: center;
    width: 100%;
  }

  .controls {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }

  button {
    font-size: 1.25rem;
    font-weight: 600;
    padding: 0.9rem 2rem;
    border-radius: 0.75rem;
    border: 2px solid currentColor;
    background: transparent;
    color: inherit;
    cursor: pointer;
    min-width: 130px;
    transition: transform 0.08s ease, background-color 0.15s ease;
  }

  button:hover {
    background: rgba(0, 0, 0, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    button:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  }

  button:active {
    transform: scale(0.97);
  }

  button:focus-visible {
    outline: 3px solid #2563eb;
    outline-offset: 3px;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Primary "Start" button gets a filled treatment so it stands out */
  #startBtn {
    background: #16a34a;
    border-color: #16a34a;
    color: #ffffff;
  }

  #startBtn:hover {
    background: #15803d;
  }

  #startBtn:disabled {
    background: #16a34a;
    opacity: 0.4;
  }

  /* Screen-reader-only text: visible to assistive tech, invisible on screen */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Small screens: stack buttons vertically and let them fill the width */
  @media (max-width: 420px) {
    .controls {
      flex-direction: column;
      align-items: stretch;
    }
    button {
      width: 100%;
    }
  }
</style>
</head>
<body>

  <main class="timer-card">
    <!-- Announces which phase (work or break) is currently active. Marked
         aria-live so screen reader users hear it change automatically
         when one phase hands off to the next. -->
    <div id="phaseLabel" class="phase-label phase-work" aria-live="polite">Work</div>

    <!-- role="timer" + aria-live tells screen readers this region updates
         and should be announced periodically, without interrupting the user
         on every single second -->
    <div
      id="display"
      class="display"
      role="timer"
      aria-live="off"
      aria-atomic="true"
    >25:00</div>
    <span id="statusText" class="sr-only" aria-live="polite"></span>

    <div class="controls">
      <button id="startBtn" type="button">Start</button>
      <button id="pauseBtn" type="button" disabled>Pause</button>
      <button id="resetBtn" type="button">Reset</button>
      <button id="muteBtn" type="button" aria-pressed="false">Mute</button>
    </div>
  </main>

<script>
  // v2.0 - added automatic work/break cycle
  // -----------------------------------------------------------------------
  // This is a countdown timer that automatically alternates between a
  // "work" phase and a "break" phase. It works by:
  //   1. Storing the total time remaining in seconds (not minutes/seconds
  //      separately) - this makes the countdown math much simpler.
  //   2. Tracking which phase ("work" or "break") is currently active.
  //   3. Using setInterval() to subtract one second at a time.
  //   4. Re-rendering the MM:SS display every time the seconds change.
  //   5. When the countdown hits zero, flipping to the other phase,
  //      loading that phase's duration, and immediately starting it again
  //      - so work leads into break, and break leads back into work,
  //      without the user having to press Start each time.
  //
  // No external libraries are used - this is plain "vanilla" JavaScript.
  // -----------------------------------------------------------------------

  // How long each phase lasts, in total seconds.
  const WORK_SECONDS = 0.1 * 60;
  const BREAK_SECONDS = 5 * 60;

  // Which phase is currently active: either the string 'work' or 'break'.
  // This drives the label text, the page background color, and which
  // duration gets loaded when a phase finishes.
  let currentPhase = 'work';

  // This variable tracks how many seconds are left on the clock right now.
  // It changes every second while the timer is running.
  let secondsRemaining = WORK_SECONDS;

  // This holds the ID returned by setInterval(), so we can cancel
  // (clear) the interval later when the user pauses. It's `null`
  // whenever the timer is NOT actively running.
  let intervalId = null;

  // Whether the beep sound is currently silenced. Toggled by the Mute
  // button. Starts as false (sound on).
  let isMuted = false;

  // The Web Audio API context used to synthesize the beep. It's created
  // lazily (on the first Start click) rather than at page load, because
  // browsers block audio contexts from making sound until the user has
  // interacted with the page at least once.
  let audioContext = null;

  // A single persistent "volume knob" that every beep is routed through
  // on its way to the speakers. Rather than only deciding whether to
  // play a beep at all, mute works by turning this knob to 0 - that way
  // muting is tied directly to what the speakers actually receive, not
  // just to whether a beep gets scheduled.
  let masterGainNode = null;

  // Grab references to the HTML elements we need to read from or update.
  // Doing this once up front (rather than re-searching the page every
  // time) is more efficient.
  const displayEl = document.getElementById('display');
  const statusTextEl = document.getElementById('statusText');
  const phaseLabelEl = document.getElementById('phaseLabel');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const muteBtn = document.getElementById('muteBtn');

  // -----------------------------------------------------------------------
  // formatTime(totalSeconds)
  // Converts a raw number of seconds (e.g. 125) into a "MM:SS" style
  // string (e.g. "02:05"). padStart() adds a leading zero if needed so
  // the display always shows two digits for both minutes and seconds.
  // -----------------------------------------------------------------------
  function formatTime(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    const minutesStr = String(minutes).padStart(2, '0');
    const secondsStr = String(seconds).padStart(2, '0');
    return minutesStr + ':' + secondsStr;
  }

  // -----------------------------------------------------------------------
  // updateDisplay()
  // Pushes the current value of secondsRemaining onto the screen.
  // -----------------------------------------------------------------------
  function updateDisplay() {
    displayEl.textContent = formatTime(secondsRemaining);
  }

  // -----------------------------------------------------------------------
  // applyPhaseAppearance()
  // Updates everything that visually signals which phase is active right
  // now: the <body> background color class and the text/color of the
  // phase label. Called whenever the phase changes.
  // -----------------------------------------------------------------------
  function applyPhaseAppearance() {
    // Remove both phase classes first, then add back only the one that
    // matches the current phase - this avoids ever having both (or
    // neither) applied at once.
    document.body.classList.remove('phase-work', 'phase-break');
    document.body.classList.add('phase-' + currentPhase);

    phaseLabelEl.classList.remove('phase-work', 'phase-break');
    phaseLabelEl.classList.add('phase-' + currentPhase);

    phaseLabelEl.textContent = currentPhase === 'work' ? 'Work' : 'Break';
  }

  // -----------------------------------------------------------------------
  // unlockAudio()
  // Browsers only allow sound to start playing after a direct user
  // gesture (like a click) - if an AudioContext is created later, inside
  // an asynchronous callback such as setInterval's, some browsers keep
  // it permanently "suspended" and no sound ever plays. To avoid that,
  // we create (and resume) the AudioContext right here, synchronously,
  // inside the Start button's own click handler - a genuine user gesture
  // - so it's unlocked before it's ever actually needed.
  // -----------------------------------------------------------------------
  function unlockAudio() {
    if (audioContext === null) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContextClass();
    }
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
    if (masterGainNode === null) {
      masterGainNode = audioContext.createGain();
      masterGainNode.gain.value = isMuted ? 0 : 1;
      masterGainNode.connect(audioContext.destination);
    }
  }

  // -----------------------------------------------------------------------
  // playBeep()
  // Synthesizes a short beep sound entirely in code - no audio file is
  // loaded or downloaded. It works by:
  //   1. Reusing the AudioContext that was already unlocked in
  //      unlockAudio() (falling back to creating one here too, in case
  //      playBeep somehow runs before Start was ever clicked).
  //   2. Creating an "oscillator" node, which produces a pure tone at a
  //      chosen frequency (here, 880 Hz - a clear, attention-getting
  //      pitch, roughly the musical note A5).
  //   3. Creating a "gain" node, which controls volume over time. We ramp
  //      the volume up quickly and back down to silence, which gives the
  //      beep a soft edge instead of an abrupt click.
  //   4. Connecting oscillator -> gain -> speakers, then starting and
  //      stopping the oscillator after a fraction of a second.
  // Does nothing if the user has muted the timer.
  // -----------------------------------------------------------------------
  function playBeep() {
    unlockAudio();

    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.value = 880; // Hz - a clear, pleasant beep pitch

    const now = audioContext.currentTime;
    const beepDuration = 10.35; // seconds

    // Volume envelope: quickly rise to full volume, then fade out. This
    // avoids the harsh "click" that happens if a tone starts/stops at
    // full volume instantly.
    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(0.3, now + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + beepDuration);

    // Route through the master gain node (the mute "volume knob") rather
    // than straight to the speakers, so the current mute state is always
    // respected, however this beep got triggered.
    oscillator.connect(gainNode);
    gainNode.connect(masterGainNode);

    oscillator.start(now);
    oscillator.stop(now + beepDuration);
  }

  // -----------------------------------------------------------------------
  // toggleMute()
  // Runs when the Mute button is clicked. Flips the isMuted flag and
  // updates the button's label/pressed-state so its current status is
  // clear both visually and to screen readers.
  // -----------------------------------------------------------------------
  function toggleMute() {
    isMuted = !isMuted;

    // Update what the user actually sees FIRST. Unlocking audio touches
    // a browser API that can be blocked or restricted in some contexts
    // (like the sandboxed frame this page may be running in) and can
    // throw an error - if that happened before these lines ran, the
    // button would look like it did nothing at all. Doing the visible
    // update first guarantees the button always responds, no matter
    // what happens with audio.
    muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
    muteBtn.setAttribute('aria-pressed', String(isMuted));
    statusTextEl.textContent = isMuted ? 'Sound muted.' : 'Sound unmuted.';

    // This click is also a genuine user gesture, so use it as another
    // opportunity to unlock audio - covers the case where the user
    // clicks Mute/Unmute before ever clicking Start. Wrapped in
    // try/catch so that if the browser refuses (e.g. audio is blocked
    // in this environment), it fails silently instead of breaking
    // anything else on the page.
    try {
      unlockAudio();
      // Turn the master volume knob itself - this is what actually
      // mutes sound, and it takes effect instantly, even silencing a
      // beep that's already partway through playing.
      masterGainNode.gain.value = isMuted ? 0 : 1;
    } catch (err) {
      console.warn('Could not update audio mute state:', err);
    }
  }

  // -----------------------------------------------------------------------
  // switchPhase()
  // Called when a countdown reaches zero. Flips currentPhase to the
  // other phase, loads that phase's full duration, updates the on-screen
  // color/label, and immediately starts counting down again - this is
  // what makes work automatically lead into break and back again.
  // -----------------------------------------------------------------------
  function switchPhase() {
    currentPhase = (currentPhase === 'work') ? 'break' : 'work';
    secondsRemaining = (currentPhase === 'work') ? WORK_SECONDS : BREAK_SECONDS;

    playBeep();
    applyPhaseAppearance();
    updateDisplay();

    statusTextEl.textContent = currentPhase === 'work'
      ? 'Break finished. Work timer started.'
      : 'Work finished. Break timer started.';
  }

  // -----------------------------------------------------------------------
  // tick()
  // Called once per second while the timer is running. Counts down by
  // one second. When it reaches zero, hands off to the other phase and
  // keeps running rather than stopping.
  // -----------------------------------------------------------------------
  function tick() {
    secondsRemaining -= 1;

    if (secondsRemaining <= 0) {
      switchPhase();
    } else {
      updateDisplay();
    }
  }

  // -----------------------------------------------------------------------
  // stopInterval()
  // Small helper that clears the running interval (if any) and resets
  // intervalId back to null so the rest of the code knows the timer
  // is not currently ticking.
  // -----------------------------------------------------------------------
  function stopInterval() {
    if (intervalId !== null) {
      clearInterval(intervalId);
      intervalId = null;
    }
  }

  // -----------------------------------------------------------------------
  // startTimer()
  // Runs when the Start button is clicked. Does nothing if the timer is
  // already running or has already reached zero (Reset must be used
  // first in that case). Otherwise kicks off a 1-second repeating timer.
  // -----------------------------------------------------------------------
  function startTimer() {
    // Guard: don't start a second interval on top of an existing one.
    if (intervalId !== null) {
      return;
    }

    // Unlock audio playback right here, inside the click handler itself,
    // so the browser recognizes this as a genuine user gesture even
    // though the beep itself won't actually play until later.
    unlockAudio();

    intervalId = setInterval(tick, 1000);

    startBtn.disabled = true;
    pauseBtn.disabled = false;
    statusTextEl.textContent = (currentPhase === 'work' ? 'Work' : 'Break') + ' timer started.';
  }

  // -----------------------------------------------------------------------
  // pauseTimer()
  // Runs when the Pause button is clicked. Simply stops the interval
  // without changing secondsRemaining, so the user can resume later
  // from exactly where they left off.
  // -----------------------------------------------------------------------
  function pauseTimer() {
    stopInterval();

    startBtn.disabled = false;
    pauseBtn.disabled = true;
    statusTextEl.textContent = 'Timer paused.';
  }

  // -----------------------------------------------------------------------
  // resetTimer()
  // Runs when the Reset button is clicked. Stops any running countdown
  // and restores secondsRemaining back to the full 25 minutes, then
  // redraws the display and re-enables the Start button.
  // -----------------------------------------------------------------------
  function resetTimer() {
    stopInterval();

    currentPhase = 'work';
    secondsRemaining = WORK_SECONDS;
    applyPhaseAppearance();
    updateDisplay();

    startBtn.disabled = false;
    pauseBtn.disabled = true;
    statusTextEl.textContent = 'Timer reset. Work phase, 25 minutes.';
  }

  // -----------------------------------------------------------------------
  // Wire up the buttons to their corresponding functions, and draw the
  // initial "25:00" display as soon as the page loads.
  // -----------------------------------------------------------------------
  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', resetTimer);
  muteBtn.addEventListener('click', toggleMute);

  applyPhaseAppearance();
  updateDisplay();
</script>

</body>
</html>
